{% extends 'WLA/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 card p-4 shadow-sm text-center">
        <h2>Confirmar Eliminación</h2>
        <p class="mt-3">¿Estás seguro de que deseas eliminar la tarifa <strong>{{ tarifa.servicio }}</strong>?</p>
        <form method="post" class="mt-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'lista_tarifas' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
