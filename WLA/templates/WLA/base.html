<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>WLA - Plataforma de Gestión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'menu_principal' %}">WLA Management</a>
            <div class="collapse navbar-collapse">
                <div class="navbar-nav me-auto">
                    <a class="nav-link" href="{% url 'menu_principal' %}">Menú</a>
                    <a class="nav-link" href="{% url 'lista_tarifas' %}">Tarifas</a>
                    <a class="nav-link" href="{% url 'lista_conductores' %}">Conductores</a>
                    <a class="nav-link" href="{% url 'lista_flota' %}">Flota</a>
                    <a class="nav-link" href="{% url 'lista_reservas' %}">Reservas</a>
                    <a class="nav-link" href="{% url 'lista_clientes' %}">Clientes</a>
                </div>
                <div class="navbar-nav ms-auto">
                    {% if user.is_authenticated %}
                        <span class="nav-link text-light me-2">Usuario: {{ user.username }}</span>
                        <form action="{% url 'logout' %}" method="post" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
                        </form>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
